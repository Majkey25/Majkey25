name: Refresh profile widgets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check snapshot fallback
        run: python3 -B -m unittest discover -s scripts -p test_refresh_widgets.py

      - uses: actions/checkout@v4
        with:
          ref: output
          path: .reference/tmp/previous

      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@2.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Refresh Spotify and streak snapshots
        run: python3 scripts/refresh_widgets.py .reference/tmp/previous dist

      - name: push SVG assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
