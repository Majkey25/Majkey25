name: Refresh profile music and activity

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

concurrency:
  group: profile-widgets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Spotify outage fallback
        run: python3 -B -m unittest discover -s scripts -p test_refresh_spotify.py

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: output
          path: .reference/tmp/previous
          persist-credentials: false

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@15e2d8e093cc9c76cb88ffc850328528cb90ecfd # 2.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Refresh Spotify snapshot
        run: python3 scripts/refresh_spotify.py .reference/tmp/previous dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-widgets
          path: dist/*.svg
          if-no-files-found: error

  publish:
    needs: generate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-widgets
          path: dist
      - name: push SVG assets to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
