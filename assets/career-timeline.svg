  <title id="title">Career so far</title>
  <desc id="description">A shared timeline with year markers from 2021 to 2027 and data shown through October 2026. Mechanical Engineering at SPŠ Zlín, 2021–2025. Azure Programming at the Microsoft-supported Student Trainee Center, January 2023–June 2025. AI and full-stack development at OKsystem, June 2025–present, with an arrow indicating continuation. Software Engineering at UTB Zlín, September 2025–May 2030 (expected graduation), with a continuation arrow. AI safety and red teaming, May–September 2026.</desc>
